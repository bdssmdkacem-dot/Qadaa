name: qadaa
description: Arabic-first Android app for planning and tracking missed prayers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_local_notifications: ^23.0.4
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
