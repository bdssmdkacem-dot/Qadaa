name: Flutter quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qadaa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files when absent
        shell: bash
        run: |
          # The repository may contain only custom Android resources (such as
          # the launcher icon) without the actual Flutter Android host project.
          # Check for the manifest, not merely the directory, before deciding
          # whether platform scaffolding is present.
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name qadaa --org com.qadaa .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: qadaa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
