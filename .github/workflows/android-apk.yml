name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/first-run-language-commercial-home]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android platform files when absent
        shell: bash
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name qadaa --org com.qadaa .
          fi
      - name: Configure Android scheduled notifications
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in text:
              text = text.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application',
                  1,
              )
          receivers = """
                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"
                      android:exported="false" />
                  <receiver
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          """
          if "ScheduledNotificationBootReceiver" not in text:
              text = text.replace("</application>", receivers + "\n    </application>", 1)
          text = text.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/qadaa_icon"')
          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected Flutter Kotlin Gradle app file was not generated")
          g = gradle.read_text()
          g = g.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          if "isCoreLibraryDesugaringEnabled" not in g:
              g = g.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )
          if "coreLibraryDesugaring(" not in g:
              if "dependencies {" in g:
                  g = g.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
              else:
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          if "compileSdk = 37" not in g or "isCoreLibraryDesugaringEnabled" not in g or "coreLibraryDesugaring(" not in g:
              raise SystemExit("Notification Gradle configuration could not be applied")
          gradle.write_text(g)
          PY

      - name: Apply Qadaa launcher icon
        run: sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/qadaa_icon"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: qadaa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
