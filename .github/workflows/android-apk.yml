name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/first-run-language-commercial-home]
    paths:
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android platform files when absent
        shell: bash
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --project-name qadaa --org com.qadaa .
          fi
      - name: Apply Qadaa launcher icon
        run: sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/qadaa_icon"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: qadaa-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
